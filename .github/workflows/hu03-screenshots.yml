name: HU03 - teste e capturas

on:
  push:
    branches:
      - feat/hu03-integracao-template
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validar-hu03:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador de testes
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Subir servidor HTTP (equivalente ao Live Server)
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/hu03-server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/pages/adesao.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hu03-server.log
          exit 1
      - name: Testar HU03 e gerar screenshots
        run: node scripts/test-hu03.mjs
      - name: Registrar evidencias em docs/telas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/telas/hu03-adesao.png docs/telas/hu03-adesao-inferior.png
          if git diff --cached --quiet; then
            echo "Prints ja estao atualizados"
          else
            git commit -m "docs(hu03): registra capturas reais de Chromium"
            git push
          fi
