name: MVP - integração e regressões

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mvp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar-mvp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe e testes sem navegador
        run: |
          for arquivo in assets/js/*.js scripts/*.mjs tests/*.mjs; do
            node --check "$arquivo"
          done
          node --test scripts/test-api.mjs scripts/test-hu02.mjs tests/*.mjs
      - name: Instalar navegador de testes
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Subir servidor HTTP
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/mvp-server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/index.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mvp-server.log
          exit 1
      - name: Testar HU03, HU04 e integração das histórias
        run: |
          resultado=0
          node scripts/test-hu03.mjs || resultado=1
          node scripts/test-hu03-mobile.mjs || resultado=1
          node scripts/test-hu04.mjs || resultado=1
          node scripts/test-hu04-primeiro-acesso.mjs || resultado=1
          node scripts/test-integracao.mjs || resultado=1
          exit "$resultado"
      - name: Guardar evidências sem alterar o repositório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp-evidencias-${{ github.sha }}
          path: |
            artifacts/
            docs/telas/hu03-adesao.png
            docs/telas/hu03-adesao-inferior.png
          if-no-files-found: warn
          retention-days: 7
