<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulbe | Boas-vindas</title>
  <link rel="icon" href="../assets/img/logo-colorida.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/hu04.css">
</head>
<body data-raiz="../">
  <div class="bulbe-shell">
    <header class="bulbe-header bulbe-header--claro">
      <span></span>
      <img class="bulbe-logo" src="../assets/img/logo-colorida.png" alt="Bulbe">
      <button class="bulbe-icon-btn" type="button" aria-label="Falar com o suporte humano" data-acao="suporte">
        <svg class="bulbe-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14v-3a8 8 0 0 1 16 0v3M4 12H2v6h4v-6H4m16 0h2v6h-4v-6h2m0 6c0 3-3 3-6 3"/></svg>
      </button>
    </header>

    <main class="bulbe-content boas-vindas">
      <h1>Entenda como a Bulbe funciona</h1>
      <p class="legenda">Uma apresentação rápida do serviço</p>
      <div id="slide" aria-live="polite"></div>
    </main>

    <footer class="rodape-boas-vindas">
      <div id="controles" class="controles-boas-vindas" hidden>
        <p id="posicao" class="legenda" aria-live="polite"></p>
        <div class="botoes-carrossel">
          <button id="anterior" class="bulbe-button bulbe-button--secundario" type="button">Voltar</button>
          <button id="proximo" class="bulbe-button" type="button">Continuar</button>
        </div>
      </div>
      <a class="link pular-apresentacao" href="../index.html">Pular apresentação</a>
      <p class="legenda">Protótipo com dados fictícios</p>
    </footer>
  </div>
  <script type="module" src="../assets/js/boas-vindas.js"></script>
</body>
</html>
