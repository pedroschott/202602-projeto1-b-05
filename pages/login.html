<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08068d">
  <title>Bulbe | Acesso demonstrativo</title>
  <link rel="icon" href="../assets/img/logo-colorida.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/hu04.css">
</head>
<body data-raiz="../">
  <div class="bulbe-shell">
    <!-- Cabeçalho azul padrão da Bulbe, com a logo clara -->
    <header class="bulbe-header">
      <a class="bulbe-icon-btn" href="boas-vindas.html" aria-label="Voltar à apresentação">
        <svg class="bulbe-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      </a>
      <img class="bulbe-logo" src="../assets/img/logo-clara.png" alt="Bulbe">
      <button class="bulbe-icon-btn" type="button" aria-label="Falar com o suporte humano" data-acao="suporte">?</button>
    </header>

    <main class="bulbe-content acesso-form">
      <h1>Informe seus dados</h1>
      <p class="acesso-form-duvidas">
        Em caso de dúvidas,
        <button class="link" type="button" data-acao="suporte">clique aqui</button>.
      </p>
      <p class="acesso-form-intro">Preencha seus dados e comece a economizar na sua conta de luz.</p>

      <!-- Dados fictícios e só de leitura: nada é digitado, salvo ou enviado -->
      <div class="acesso-form-campos">
        <div class="campo-contorno">
          <label for="demo-nome">Nome completo <span class="obrigatorio" aria-hidden="true">*</span></label>
          <input id="demo-nome" type="text" value="Ana Demonstração" readonly>
        </div>

        <div class="campo-contorno">
          <label for="demo-email">E-mail <span class="obrigatorio" aria-hidden="true">*</span></label>
          <input id="demo-email" type="email" value="ana.demo@exemplo.com" readonly>
        </div>

        <div class="campo-contorno campo-contorno--icone">
          <label for="demo-whatsapp">Número de Whatsapp <span class="obrigatorio" aria-hidden="true">*</span></label>
          <!-- Ícone do WhatsApp dentro do campo -->
          <svg class="campo-icone-whatsapp" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.3-.4.8-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.2c0-.1-.2-.2-.4-.3Z"/>
          </svg>
          <input id="demo-whatsapp" type="tel" value="(21) 90000-0000" readonly>
        </div>
      </div>

      <p class="acesso-form-termos">
        Ao submeter minhas respostas e clicar em <strong>“Quero economizar”</strong>,
        concordo com a <span class="acesso-form-politica">Política de Privacidade</span> da Bulbe energia.
      </p>
    </main>

    <!-- Rodapé fixo com o botão principal -->
    <footer class="acesso-form-rodape">
      <a class="bulbe-button bulbe-button--largo" id="entrar-demonstracao" href="../index.html">Quero economizar</a>
    </footer>
  </div>
  <script type="module" src="../assets/js/login.js"></script>
</body>
</html>
